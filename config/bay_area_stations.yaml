# Starter list of San Francisco-Oakland-San Jose DMA broadcast stations.
# VERIFY AND EXPAND this against https://publicfiles.fcc.gov/find before
# relying on it - callsigns, ownership, and which stations maintain an online
# political file can change. Radio political files only became mandatory for
# larger-market stations; smaller/independent stations may not have one.
#
# market: a human label used for tagging (Drive properties + DB), not sent to
# the FCC API.

