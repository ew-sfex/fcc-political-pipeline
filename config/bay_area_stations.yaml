# Starter list of San Francisco-Oakland-San Jose DMA broadcast stations.
# VERIFY AND EXPAND this against https://publicfiles.fcc.gov/find before
# relying on it - callsigns, ownership, and which stations maintain an online
# political file can change. Radio political files only became mandatory for
# larger-market stations; smaller/independent stations may not have one.
#
# market: a human label used for tagging (Drive properties + DB), not sent to
# the FCC API.
#
# entity_id: the station's FCC facility/entity ID. Optional but recommended -
# when present, ingest skips the (slow, browser-based) lookup that derives it
# from the RSS feed and goes straight to the folder API. To add a new station
# without it, leave entity_id off and it'll be resolved automatically on the
# next run (just slower). IDs verified 2026-08-12.

market: "San Francisco-Oakland-San Jose"

stations:
  - callsign: KGO-TV
    service: TV
    entity_id: "34470"
  - callsign: KPIX-TV
    service: TV
    entity_id: "25452"
  - callsign: KRON-TV
    service: TV
    entity_id: "65526"
  - callsign: KTVU
    service: TV
    entity_id: "35703"
  - callsign: KNTV
    service: TV
    entity_id: "35280"
  - callsign: KQED
    service: TV
    entity_id: "35500"
  - callsign: KICU-TV
    service: TV
    entity_id: "34564"
  - callsign: KOFY-TV
    service: TV
    entity_id: "51189"
  - callsign: KCNS
    service: TV
    entity_id: "71586"
  - callsign: KKPX-TV
    service: TV
    entity_id: "22644"
  - callsign: KEMO-TV
    service: TV
    entity_id: "34440"
  - callsign: KTSF
    service: TV
    entity_id: "37511"
  # Radio - add commercial stations with 5+ FTEs in the market per FCC rules;
  # this list is intentionally incomplete as a starting point.
  - callsign: KCBS
    service: AM
    entity_id: "9637"
  - callsign: KNBR
    service: AM
    entity_id: "35208"
  # Cable systems (service: CABLE). entity_id is the system's PSID (from its
  # publicfiles.fcc.gov/cable-profile/<PSID> URL), used directly - cable has no
  # callsign->id lookup, so entity_id is REQUIRED for cable rows. callsign here
  # is just a display label.
  #
  # NOTE on Comcast: its Bay Area franchise entities (e.g. Comcast of CA IX =
  # SF/Peninsula 001963, Comcast of CA II = South Bay 000214) each carry the
  # SAME regional political-file set (verified 2026-09-14: 100% overlap of
  # ~1,156 filings, different file GUIDs). So ONE Comcast PSID gives complete
  # Bay Area Comcast coverage - listing more would duplicate every buy (dedup
  # is by file GUID, which differs per PSID, so it would NOT catch it).
  #
  - callsign: "Comcast (Bay Area)"
    service: CABLE
    entity_id: "001963"

  # --- Statewide (CA) tier ---------------------------------------------------
  # National providers that file political ads only BY STATE (no Bay Area
  # sub-scope): AT&T U-verse (cable) and the satellite/DBS carriers. We scope
  # each to California (the walk prunes the other 49 states) and tag market
  # "California (statewide)" so the dashboard can separate this from the
  # Bay-Area-precise broadcast + Comcast rows. "California" mixes SF with
  # LA/SD/Sacramento races - there's no finer geo tag in these filings.
  - callsign: "AT&T U-verse (CA)"
    service: CABLE
    entity_id: "999999"
    scope: California
    market: "California (statewide)"
    # AT&T folders only its State + Issue Ads by state; its Federal/Local
    # candidate races are a flat NATIONAL list (state only in the committee
    # name), which the scope guard drops anyway. Restricting the walk to the
    # state-foldered categories avoids traversing that whole national tree
    # 3x/day (dropped ~7 min -> seconds; verified 2026-09-14).
    categories: ["State", "Non-Candidate Issue Ads"]
  - callsign: "DirecTV (CA)"
    service: DBS
    entity_id: "DIRECTV"
    scope: California
    market: "California (statewide)"
  # Dish (service: DBS, entity_id: DISH) intentionally omitted: ~1,729 filings
  # in 2025 and ZERO in 2026 (satellite political sales appear to have dried
  # up). Re-add if it picks back up:
  #   - callsign: "Dish (CA)"
  #     service: DBS
  #     entity_id: "DISH"
  #     scope: California
  #     market: "California (statewide)"
  #
  # Astound/Wave (Bay Area cable): enumeration via the zip->cable search TODO.
  # Two stations removed 2026-08-07 after verifying against
  # https://publicfiles.fcc.gov/find - neither callsign has any match there
  # (TV+FM+AM search), meaning the callsign doesn't exist in FCC's current
  # directory, likely a format/ownership change since this list was made. If
  # you know either station's current callsign, re-add it and it'll pick
  # right up:
  #   - KGO (810 AM, San Francisco)
  #   - KBCW (TV, San Francisco)
