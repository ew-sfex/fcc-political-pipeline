name: FCC Political Filings Ingest

on:
  schedule:
    # Daily at 13:00 UTC (~6am PT / 5am PDT-adjusted). Adjust as needed.
    - cron: "0 13 * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" trigger from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      # Metadata-only for now (see README) - Drive/PDF secrets not needed
      # until FCC's download endpoint is reachable programmatically.
      - name: Run ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.ingest
