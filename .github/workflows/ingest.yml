name: FCC Political Filings Ingest

on:
  schedule:
    # 3x daily, targeting ~7am / noon / 4pm Pacific to catch same-day filings
    # before they'd age out (the folder-walk ingest is complete, but running
    # often keeps the DB fresh for newsroom use). GitHub cron is UTC and does
    # NOT observe DST - these are set for PDT (summer, UTC-7); during PST
    # (winter) they land an hour earlier (6am/11am/3pm). Adjust if that
    # matters.
    - cron: "0 14 * * *"   # 7am PDT
    - cron: "0 19 * * *"   # noon PDT
    - cron: "0 23 * * *"   # 4pm PDT
  workflow_dispatch:     # manual "Run workflow" trigger from the Actions tab
    inputs:
      suppress_alerts:
        description: "Skip Slack alerts (check this for the one-time history backfill)"
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      # Metadata-only for now (see README) - Drive/PDF secrets not needed
      # until FCC's download endpoint is reachable programmatically.
      # SLACK_WEBHOOK_URL drives new-filing alerts; if the secret is unset,
      # alerts are simply skipped (ingest still runs).
      # SUPPRESS_ALERTS is set only when the manual-run checkbox is ticked;
      # scheduled runs leave it empty, so they alert normally.
      - name: Run ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUPPRESS_ALERTS: ${{ inputs.suppress_alerts && '1' || '' }}
        run: python -m src.ingest
